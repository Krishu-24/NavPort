name: Build apps

# Builds the native shells for every platform. This exists mainly so macOS and
# iOS are reachable at all: those can only be built on macOS, and GitHub's
# macOS runners are free for public repositories — which is the normal way to
# ship Apple targets without owning a Mac.

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: 'API origin to bake into the builds (e.g. https://navport.azurecontainerapps.io)'
        required: true
        type: string
  push:
    tags: ['v*']

permissions:
  contents: write     # needed to attach artefacts to a release

jobs:
  desktop:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing shouldn't discard the others, which may have
      # taken 20 minutes each.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            args: ''
          - os: macos-latest
            label: macOS (Apple Silicon)
            args: '--target aarch64-apple-darwin'
          - os: macos-latest
            label: macOS (Intel)
            args: '--target x86_64-apple-darwin'
          - os: ubuntu-22.04
            label: Linux
            args: ''

    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Both Apple architectures are built from the same runner.
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          # Otherwise all four matrix legs fight over one cache key.
          key: ${{ matrix.label }}

      - name: Install npm dependencies
        working-directory: desktop
        run: npm ci || npm install

      - name: Generate icons
        working-directory: desktop
        run: npm run icons

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Baked in at compile time — see desktop/src-tauri/src/lib.rs. A tag
          # build falls back to the repository variable so a release doesn't
          # need the input.
          NAVPORT_API_BASE: ${{ inputs.api_base || vars.NAVPORT_API_BASE }}
        with:
          projectPath: desktop
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'NavPort ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: navport-${{ matrix.label }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            desktop/src-tauri/target/**/release/bundle/msi/*.msi
            desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/**/release/bundle/deb/*.deb
            desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Rust toolchain with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: android

      - name: Install npm dependencies
        working-directory: desktop
        run: npm ci || npm install

      - name: Generate icons
        working-directory: desktop
        run: npm run icons

      - name: Build the APK
        working-directory: desktop
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          NAVPORT_API_BASE: ${{ inputs.api_base || vars.NAVPORT_API_BASE }}
        run: |
          npm run android:init
          npm run android:apk

      # Unsigned on purpose. Signing here would mean putting a release
      # keystore into repository secrets; for a student project it is safer to
      # sign locally. The APK below installs on a device with "unknown
      # sources" enabled, which is enough to demo it.
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: navport-android-unsigned
          retention-days: 14
          if-no-files-found: warn
          path: desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  ios:
    name: iOS (simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust toolchain with iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: ios

      - name: CocoaPods
        run: brew install cocoapods

      - name: Install npm dependencies
        working-directory: desktop
        run: npm ci || npm install

      - name: Generate icons
        working-directory: desktop
        run: npm run icons

      # A device or TestFlight build needs a paid Apple Developer account and
      # a provisioning profile in secrets. This job verifies the iOS project
      # generates and compiles, which is the part that can actually break from
      # a code change. Ship to a device from a Mac.
      - name: Generate and build the iOS project
        working-directory: desktop
        env:
          NAVPORT_API_BASE: ${{ inputs.api_base || vars.NAVPORT_API_BASE }}
        run: |
          npm run ios:init
          npm run tauri -- ios build --target aarch64-apple-ios-sim || {
            echo "::warning::iOS build failed — this usually means signing configuration is needed."
            exit 0
          }
