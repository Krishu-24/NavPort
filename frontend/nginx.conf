# nginx config for the local dashboard container (see Dockerfile).
# Production is Azure Static Web Apps, which reads public/staticwebapp.config.json
# directly; the two generated includes below come from that same file.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # "Server: nginx" without the version number — the exact version is free
    # reconnaissance for anyone matching against a CVE list.
    server_tokens off;

    # Text-shaped files only; woff2 and the images are already compressed.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json
               application/manifest+json image/svg+xml text/plain;

    # Security headers (CSP, X-Frame-Options, ...) for every response.
    include /etc/nginx/navport/headers.conf;

    # Per-path rules: sw.js is never cached, .webmanifest gets its real type.
    include /etc/nginx/navport/routes.conf;

    location / {
        try_files $uri $uri/ =404;
    }
}
