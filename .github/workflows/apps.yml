name: Build apps

# Builds the native shells for every platform. This exists mainly so macOS and
# iOS are reachable at all: those can only be built on macOS, and GitHub's
# macOS runners are free for public repositories — which is the normal way to
# ship Apple targets without owning a Mac.
#
#   Run workflow (Actions tab)   desktop installers as downloadable artifacts
#   push a tag like v2.0.2       the same, then one draft GitHub Release with
#                                every installer under a fixed name
#
# The API address baked into the apps is the repository variable API_BASE_URL
# — the same one the Frontend workflow gives the dashboard — unless the run
# overrides it.

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: 'API origin to bake in. Empty = the API_BASE_URL repository variable'
        required: false
        type: string
      mobile:
        description: 'Also build Android and iOS (slower; the APK is unsigned)'
        required: false
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read      # only the release job below writes, and asks for it itself

jobs:
  desktop:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing shouldn't discard the others, which may have
      # taken 20 minutes each.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            args: ''
          - os: macos-latest
            label: macOS (Apple Silicon)
            args: '--target aarch64-apple-darwin'
          - os: macos-latest
            label: macOS (Intel)
            args: '--target x86_64-apple-darwin'
          - os: ubuntu-22.04
            label: Linux
            args: ''

    env:
      # Baked in at compile time — see desktop/src-tauri/src/lib.rs.
      NAVPORT_API_BASE: ${{ inputs.api_base || vars.API_BASE_URL }}

    steps:
      - uses: actions/checkout@v5

      - name: Check the API address is set
        # Without it the app builds fine and then can't reach anything — the
        # failure would only show up after someone installed it.
        shell: bash
        run: |
          if [ -z "$NAVPORT_API_BASE" ]; then
            echo "::error::No API address. Set the API_BASE_URL repository variable, or pass api_base."
            exit 1
          fi
          echo "Baking in $NAVPORT_API_BASE"

      - name: Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Both Apple architectures are built from the same runner.
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          # Otherwise all four matrix legs fight over one cache key.
          key: ${{ matrix.label }}

      - name: Install npm dependencies
        working-directory: desktop
        run: npm ci || npm install

      - name: Generate icons
        working-directory: desktop
        run: npm run icons

      - name: Build
        # Build only. Publishing is the release job's, so that a release is
        # made once, from every platform's installers, under names it chooses.
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop
          args: ${{ matrix.args }}

      - name: Upload artefacts
        uses: actions/upload-artifact@v5
        with:
          name: navport-${{ matrix.label }}
          retention-days: 14
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/**/release/bundle/msi/*.msi
            desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/**/release/bundle/deb/*.deb
            desktop/src-tauri/target/**/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage

  release:
    name: Draft the GitHub Release
    # Only for a version tag, and only once every platform has built: a
    # release with some installers missing is worse than none.
    if: github.ref_type == 'tag'
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5        # for .github/release-notes.md

      - uses: actions/download-artifact@v5
        with:
          pattern: navport-*
          path: dist

      - name: Give the installers fixed names
        # Tauri puts the version in every file name. These names have none,
        # so /releases/latest/download/NavPort_x64-setup.exe always means the
        # newest Windows installer, and the dashboard's download button
        # (frontend/public/js/ui/download.js) never needs updating. Change a
        # name here and it must change there too.
        shell: bash
        run: |
          set -euo pipefail
          mkdir out
          take() {  # take <artifact> <file pattern> <published name>
            mapfile -t found < <(find "dist/$1" -type f -name "$2")
            if [ "${#found[@]}" -ne 1 ]; then
              echo "::error::expected exactly one $2 in $1, found ${#found[@]}"
              exit 1
            fi
            cp "${found[0]}" "out/$3"
            echo "$3  <-  ${found[0]#dist/}"
          }
          take "navport-Windows"               '*-setup.exe' NavPort_x64-setup.exe
          take "navport-Windows"               '*.msi'       NavPort_x64.msi
          take "navport-macOS (Apple Silicon)" '*.dmg'       NavPort_aarch64.dmg
          take "navport-macOS (Intel)"         '*.dmg'       NavPort_x64.dmg
          take "navport-Linux"                 '*.AppImage'  NavPort_amd64.AppImage
          take "navport-Linux"                 '*.deb'       NavPort_amd64.deb
          take "navport-Linux"                 '*.rpm'       NavPort_x86_64.rpm
          # So anyone can check a download arrived intact.
          (cd out && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Create the draft release
        # A draft: nobody sees it until it's published from the Releases page.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag \
            --title "NavPort $TAG" \
            --notes-file .github/release-notes.md

  android:
    name: Android
    runs-on: ubuntu-latest
    # Opt-in: the desktop installers are what the project ships.
    if: inputs.mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Rust toolchain with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: android

      - name: Install npm dependencies
        working-directory: desktop
        run: npm ci || npm install

      - name: Generate icons
        working-directory: desktop
        run: npm run icons

      - name: Build the APK
        working-directory: desktop
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          NAVPORT_API_BASE: ${{ inputs.api_base || vars.API_BASE_URL }}
        run: |
          npm run android:init
          npm run android:apk

      # Unsigned on purpose. Signing here would mean putting a release
      # keystore into repository secrets; for a student project it is safer to
      # sign locally. Android refuses to install an unsigned APK, so sign it
      # (apksigner, with a key of your own) before putting it on a device.
      - name: Upload the APK
        uses: actions/upload-artifact@v5
        with:
          name: navport-android-unsigned
          retention-days: 14
          if-no-files-found: warn
          path: desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  ios:
    name: iOS (simulator)
    runs-on: macos-latest
    if: inputs.mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Rust toolchain with iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: ios

      - name: CocoaPods
        run: brew install cocoapods

      - name: Install npm dependencies
        working-directory: desktop
        run: npm ci || npm install

      - name: Generate icons
        working-directory: desktop
        run: npm run icons

      # A device or TestFlight build needs a paid Apple Developer account and
      # a provisioning profile in secrets. This job verifies the iOS project
      # generates and compiles, which is the part that can actually break from
      # a code change. Ship to a device from a Mac.
      - name: Generate and build the iOS project
        working-directory: desktop
        env:
          NAVPORT_API_BASE: ${{ inputs.api_base || vars.API_BASE_URL }}
        run: |
          npm run ios:init
          npm run tauri -- ios build --target aarch64-apple-ios-sim || {
            echo "::warning::iOS build failed — this usually means signing configuration is needed."
            exit 0
          }
