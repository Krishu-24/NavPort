name: Frontend

# Deploys the dashboard to Azure Static Web Apps, then tests the live site.
#
# Turns itself on once these exist (Settings → Secrets and variables → Actions):
#
#   variable  API_BASE_URL                       the API this dashboard calls,
#                                                e.g. https://navport.<...>.azurecontainerapps.io
#   secret    AZURE_STATIC_WEB_APPS_API_TOKEN    the Static Web App's deployment token
#
# The deployment token is the only credential involved: Static Web Apps accepts
# an upload from whoever holds it, so no Azure login is needed for this half.

on:
  push:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

concurrency:
  group: frontend-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy the dashboard
    runs-on: ubuntu-latest
    if: vars.API_BASE_URL != ''

    environment:
      name: production-dashboard
      url: ${{ steps.deploy.outputs.static_web_app_url }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Point the dashboard at its API
        # Writes js/api-config.js and fills the API's origin into the page's
        # Content-Security-Policy. The address isn't secret — every visitor's
        # browser sees it — but it is per-environment, so it comes from the
        # deployment's configuration rather than from the code.
        run: python frontend/tools/site.py configure --api-base "${{ vars.API_BASE_URL }}"

      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # The files are already what gets served — there's no build step,
          # deliberately — so the upload is the folder as-is.
          app_location: frontend/public
          skip_app_build: true
          skip_api_build: true

      - name: Test the live site
        # The same test CI runs locally, now against production: headers,
        # content types, compression, and a CSP that admits the API.
        run: python frontend/tests/site_test.py "${{ steps.deploy.outputs.static_web_app_url }}"
