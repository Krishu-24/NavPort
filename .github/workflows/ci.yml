name: CI

# Runs on every push and pull request. Nothing here deploys anything — that's
# backend.yml and frontend.yml — so this is safe to run on any branch.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Cancel an in-progress run when the branch is pushed again — no point
# finishing a build for a commit that has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------------
  # Static checks. Fast, no network, no services — these should fail first.
  # ------------------------------------------------------------------------
  lint:
    name: Lint and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install tooling
        # The linter is pinned. Unpinned, every ruff release can add or change
        # rules, and CI starts failing on code nobody touched — which is how
        # this workflow came to fail on every push before it was fixed.
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.16.8
          python -m pip install -r backend/requirements.txt

      - name: Ruff
        run: ruff check backend/ frontend/tools/ frontend/tests/ scripts/

      - name: Byte-compile every Python file
        # Catches syntax errors in files no test happens to import.
        run: python -m compileall -q backend/ frontend/tools/ frontend/tests/ scripts/

      - name: JavaScript parses
        # The dashboard has no build step, so nothing else would catch a syntax
        # error before a browser does — and one bad module blanks the whole
        # page, because every other module imports through it.
        run: |
          for f in $(find frontend/public/js -name '*.js') frontend/public/sw.js; do
            node --check "$f" || exit 1
          done

      - name: Static Web Apps config is valid JSON
        run: python -m json.tool frontend/public/staticwebapp.config.json > /dev/null

      - name: Risk scoring
        # Pure logic, no server and no network, so it runs with the linters.
        run: python backend/tests/test_risk.py

      - name: Tauri config matches the v2 schema
        run: python scripts/check_tauri_config.py

      - name: Vendored libraries match upstream
        # Leaflet, Chart.js and IBM Plex are committed under
        # frontend/public/vendor/. This re-downloads the pinned versions and
        # compares hashes, so a hand-edited or truncated copy is caught here.
        run: python scripts/vendor_assets.py --check

  # ------------------------------------------------------------------------
  # The API, end to end, exactly as production runs it (gunicorn).
  # ------------------------------------------------------------------------
  api:
    name: API test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Start the API
        working-directory: backend
        env:
          NAVPORT_ENV: production
          NAVPORT_TRUST_PROXY: 'false'
          NAVPORT_CORS_ORIGINS: http://localhost:8080
        run: |
          gunicorn --config gunicorn.conf.py wsgi:app \
            --bind 127.0.0.1:8000 --daemon \
            --access-logfile ../api.log --error-logfile ../api.err

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health > /dev/null; then
              echo "up after ${i}s"; exit 0
            fi
            sleep 1
          done

          echo "API did not become healthy"; cat ../api.err; exit 1

      - name: Run the API test
        # The happy-path checks call aviationweather.gov, a free public API
        # that occasionally throttles. One retry keeps an upstream hiccup from
        # failing an unrelated pull request.
        env:
          NAVPORT_TEST_ORIGIN: http://localhost:8080
        run: python backend/tests/api_test.py || python backend/tests/api_test.py

      - name: API log on failure
        if: failure()
        run: cat api.log api.err || true

  # ------------------------------------------------------------------------
  # The dashboard, served by its development server.
  # ------------------------------------------------------------------------
  site:
    name: Dashboard test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Serve the dashboard
        run: |
          python frontend/tools/site.py serve --port 8080 --quiet &
          for i in $(seq 1 15); do
            curl -fsS http://127.0.0.1:8080/ > /dev/null && exit 0
            sleep 1
          done
          echo "dashboard server did not start"; exit 1

      - name: Run the dashboard test
        run: python frontend/tests/site_test.py http://127.0.0.1:8080

  # ------------------------------------------------------------------------
  # Both images, built and run together with the real docker-compose.yml.
  # ------------------------------------------------------------------------
  docker:
    name: Docker (both containers)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build both images
        run: docker compose build

      - name: Start both containers
        # Building is not the same as working. compose applies the same CPU and
        # memory ceiling as an Azure Container Apps replica, so an
        # out-of-memory problem shows up here and not in production. --wait
        # returns once both health checks pass.
        run: docker compose up -d --wait --wait-timeout 120

      - name: Neither container runs as root
        # A container that quietly reverts to root defeats the point of the
        # unprivileged users in both Dockerfiles.
        run: |
          for c in navport-backend navport-frontend; do
            uid=$(docker exec "$c" id -u)
            echo "$c uid: $uid"
            test "$uid" != "0"
          done

      - name: API test against the backend container
        env:
          NAVPORT_TEST_ORIGIN: http://localhost:8080
        run: python3 backend/tests/api_test.py http://127.0.0.1:8000 || python3 backend/tests/api_test.py http://127.0.0.1:8000

      - name: Dashboard test against the frontend container
        run: python3 frontend/tests/site_test.py http://localhost:8080

      - name: Container logs on failure
        if: failure()
        run: docker compose logs || true

      - name: Clean up
        if: always()
        run: docker compose down || true

  # ------------------------------------------------------------------------
  # Render the dashboard at seven form factors and check the layout.
  #
  # Not run on pull requests. Every screen it checks needs a real briefing,
  # which means seven calls out to aviationweather.gov, and gating an
  # unrelated PR on a free public API having a good day is not a useful
  # signal. Run it from the Actions tab after touching CSS or markup.
  # ------------------------------------------------------------------------
  ui:
    name: UI across form factors
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Start the API and the dashboard
        run: |
          (cd backend && NAVPORT_ENV=production NAVPORT_CORS_ORIGINS=http://127.0.0.1:8080 \
            gunicorn --config gunicorn.conf.py wsgi:app \
            --bind 127.0.0.1:8000 --daemon --error-logfile ../api.err)
          python frontend/tools/site.py serve --port 8080 --quiet &

          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/health > /dev/null && \
            curl -fsS http://127.0.0.1:8080/ > /dev/null && break
            sleep 1
          done

      - name: Audit every form factor
        # ubuntu-latest ships Chrome; the script finds it on PATH.
        run: python scripts/ui_matrix.py --base http://127.0.0.1:8080

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: docs/screenshots/
          if-no-files-found: warn
